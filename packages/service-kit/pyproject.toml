[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unisora-service-kit"
version = "0.1.0"
description = "Minimal cross-cutting runtime primitives (logging, correlation IDs, internal auth context, error contracts, outbox events) for UniSora microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose>=3.3.0",
    "SQLAlchemy>=2.0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["unisora_kit*"]
