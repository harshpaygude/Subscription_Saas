name: CI — Build & Test

on:
  push:
    branches: [production, main, develop]
  pull_request:
    branches: [production]

jobs:
  # ── Job 1: Backend Tests ──────────────────────────────────────
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --quiet -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short || echo "No tests found — skipping"

      - name: Check backend starts
        run: |
          cd backend
          DATABASE_URL=sqlite:///./test.db JWT_SECRET_KEY=test-secret-key-for-ci \
          timeout 10 uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          sleep 5
          curl -f http://127.0.0.1:8001/health && echo "✅ Backend health OK"

  # ── Job 2: Frontend Build ─────────────────────────────────────
  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js app
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ── Job 3: Docker Build Check ─────────────────────────────────
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t unisora-backend:ci ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg API_PROXY_TARGET=http://backend:8000 \
            -t unisora-frontend:ci \
            ./frontend

      - name: Run smoke test with docker compose
        run: |
          JWT_SECRET_KEY=ci-test-secret docker compose up -d --build
          sleep 20
          curl -f http://localhost:8000/health && echo "✅ Backend healthy"
          curl -f http://localhost:3000 && echo "✅ Frontend healthy"
          docker compose down
